version: '3.8'

services:
  estimateai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estimateai-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - AI_PROVIDER=${AI_PROVIDER:-fallback}
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_MODEL=${AI_MODEL:-gemini-1.5-flash}
      - AI_API_KEY=${AI_API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
